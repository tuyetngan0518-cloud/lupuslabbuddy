<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Glossary | Lupus Lab Buddy</title>
    <script src="/lang.js"></script>
    <link rel="preload" href="/fonts/literata-400-700-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-page="glossary">
    <main>
      <h1 data-t="glossaryTitle">Glossary</h1>
      <p class="lede" data-t="glossaryLede"></p>
      <p class="glossary-note" data-t="glossaryNote"></p>

      <!-- On wide screens the search and group links sit in a left column that stays in view. -->
      <div class="glossary-layout">
        <aside class="glossary-side">
          <div class="glossary-search">
            <label for="term-search" data-t="glossarySearch">Find a term</label>
            <input type="search" id="term-search" autocomplete="off" />
          </div>
          <p class="glossary-jump-title" data-t="glossaryJump" aria-hidden="true">Groups of terms</p>
          <nav class="glossary-jump" id="glossary-jump"></nav>
        </aside>
        <div>
          <div class="glossary" id="glossary"></div>
          <p class="lede" id="glossary-none" data-t="glossaryNone" hidden></p>
        </div>
      </div>
      <a class="to-groups" id="to-groups" href="#top" hidden></a>
    </main>
    <script type="module" src="/glossary.js"></script>
  </body>
</html>
